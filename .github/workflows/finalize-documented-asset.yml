name: Finalize Documented approved asset

on:
  push:
    branches:
      - chatgpt/documented-production-v1

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[asset-finalized]') && !contains(github.event.head_commit.message, '[asset-debug]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/documented-production-v1
          fetch-depth: 0
      - name: Apply approved asset and run final structural QA
        shell: bash
        run: |
          set +e
          python3 scripts/finalize_documented_asset.py > FINALIZE_RESULT.txt 2>&1
          status=$?
          cat FINALIZE_RESULT.txt
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add FINALIZE_RESULT.txt
            git commit -m "Record Documented finalizer failure [asset-debug]"
            git push origin HEAD:chatgpt/documented-production-v1
            exit "$status"
          fi
          rm -f FINALIZE_RESULT.txt
      - name: Remove one-time finalizer and commit
        run: |
          rm -f scripts/finalize_documented_asset.py
          rm -f .github/workflows/finalize-documented-asset.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize approved Documented image and locked copy [asset-finalized]"
          git push origin HEAD:chatgpt/documented-production-v1
