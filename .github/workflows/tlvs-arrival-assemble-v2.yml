name: TLVS assemble verified arrival preview
on:
  push:
    branches:
      - 'tlvs/arrival-three-rows-preview-20261027'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Combine v13 source and corrected 2-second middle clip
        run: |
          set -euo pipefail
          orig=assets/arrival/media/arrival-dusk-v13-1080p.mp4
          test "$(sha256sum "$orig" | awk '{print $1}')" = 'a3e7ba73738951271711028069fa2825241441c55fcbcf479ccd204929bb5f14'
          clip_url="$(awk -F "'" '/RUNWAY_CLIP:/{print $2; exit}' .github/workflows/tlvs-arrival-three-row-preview.yml)"
          test -n "$clip_url"
          curl --retry 3 --retry-delay 3 --fail --location --silent --show-error "$clip_url" -o /tmp/tlvs_middle_corrected.mp4
          ffprobe -v error /tmp/tlvs_middle_corrected.mp4
          mkdir -p previews
          ffmpeg -hide_banner -loglevel error -y -i "$orig" -i /tmp/tlvs_middle_corrected.mp4 \
            -filter_complex '[0:v]fps=24,trim=start_frame=0:end_frame=84,setpts=PTS-STARTPTS,format=yuv420p[first];[1:v]fps=24,trim=start_frame=0:end_frame=48,setpts=PTS-STARTPTS,format=yuv420p[middle];[0:v]fps=24,trim=start_frame=132:end_frame=203,setpts=PTS-STARTPTS,format=yuv420p[last];[first][middle][last]concat=n=3:v=1:a=0[video]' \
            -map '[video]' -an -r 24 -c:v libx264 -preset fast -crf 16 -movflags +faststart previews/arrival-dusk-v13-three-row-preview-1080p.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of default=noprint_wrappers=1:nokey=1 previews/arrival-dusk-v13-three-row-preview-1080p.mp4)" = 203
          sha256sum previews/arrival-dusk-v13-three-row-preview-1080p.mp4 > previews/arrival-dusk-v13-three-row-preview-1080p.mp4.sha256
      - name: Save unpublished preview in separate branch
        run: |
          set -euo pipefail
          git config user.name 'TLVS video preview automation'
          git config user.email 'actions@users.noreply.github.com'
          git add previews/arrival-dusk-v13-three-row-preview-1080p.mp4*
          git commit -m 'Build unpublished arrival middle shot three-row preview'
          git push origin HEAD:tlvs/arrival-three-rows-preview-20261027
      - uses: actions/upload-artifact@v4
        with:
          name: tlvs-three-row-preview
          path: previews/arrival-dusk-v13-three-row-preview-1080p.mp4
          retention-days: 14
