name: Finalize Documented static integration

on:
  push:
    branches:
      - chatgpt/documented-production-v1

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[skip-finalize]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/documented-production-v1
          fetch-depth: 0

      - name: Finalize static Home teaser and Documented mobile language picker
        run: python3 scripts/finalize_documented_static.py

      - name: Remove one-time finalizer
        run: |
          rm -f scripts/finalize_documented_static.py
          rm -f .github/workflows/finalize-documented-static.yml

      - name: Commit finalized integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Finalize static Documented Home integration [skip-finalize]"
          git push origin HEAD:chatgpt/documented-production-v1
