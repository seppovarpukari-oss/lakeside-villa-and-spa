name: Remove Enquire stay essentials

on:
  push:
    branches:
      - chatgpt/tahko-kuopio-route-production

permissions:
  contents: write

jobs:
  remove-enquire-facts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/tahko-kuopio-route-production
          fetch-depth: 0

      - name: Remove broker-specific fact section and dedicated CSS
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          paths = [
              Path('enquire.html'),
              Path('fi/enquire.html'),
              Path('sv/enquire.html'),
              Path('no/enquire.html'),
              Path('da/enquire.html'),
              Path('de/enquire.html'),
              Path('fr/enquire.html'),
              Path('es/enquire.html'),
              Path('nl/enquire.html'),
              Path('et/enquire.html'),
              Path('it/enquire.html'),
              Path('zh-cn/enquire.html'),
          ]

          css_start_marker = '.p0098-facts{max-width:1440px;margin:0 auto;padding:clamp(58px,6vw,88px) var(--pad);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}'
          css_end_marker = '@media(max-width:560px){.p0098-facts{padding:48px 20px}.p0098-grid{grid-template-columns:1fr}.p0098-item{min-height:0;padding:19px 18px}.p0098-facts h2{font-size:36px}}'
          email_marker = 'mailto:info@lakesidevillaandspa.com'

          for path in paths:
              text = path.read_text(encoding='utf-8')
              original = text

              if text.count(css_start_marker) != 1:
                  raise SystemExit(f'{path}: expected exactly one dedicated fact CSS start, found {text.count(css_start_marker)}')
              css_rule_start = text.index(css_start_marker)
              css_start = text.rfind('/*', 0, css_rule_start)
              if css_start == -1 or 'P-0098' not in text[css_start:css_rule_start]:
                  css_start = css_rule_start
              css_end = text.index(css_end_marker, css_rule_start) + len(css_end_marker)
              while css_end < len(text) and text[css_end] in '\r\n':
                  css_end += 1
              text = text[:css_start] + text[css_end:]

              matches = list(re.finditer(r'<section\b[^>]*\bid="stay-essentials"[^>]*>', text))
              if len(matches) != 1:
                  raise SystemExit(f'{path}: expected exactly one stay-essentials section, found {len(matches)}')
              section_start = matches[0].start()
              section_end = text.index('</section>', matches[0].end()) + len('</section>')
              while section_end < len(text) and text[section_end] in '\r\n':
                  section_end += 1
              text = text[:section_start] + text[section_end:]

              for token in ('p0098-facts', 'p0098-grid', 'p0098-item', 'p0098-head', 'p0098-kicker', 'stay-essentials'):
                  if token in text:
                      raise SystemExit(f'{path}: dedicated fact-layer token remains after removal: {token}')

              if original.count(email_marker) != text.count(email_marker) or email_marker not in text:
                  raise SystemExit(f'{path}: direct email link changed unexpectedly')
              if original.count('direct-email') != text.count('direct-email'):
                  raise SystemExit(f'{path}: direct-email structure changed unexpectedly')

              path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff --stat
          if grep -R -E "stay-essentials|p0098-facts|p0098-grid|p0098-item|p0098-head|p0098-kicker" -- */enquire.html enquire.html; then
            echo "Dedicated fact-layer code still remains" >&2
            exit 1
          fi
          for f in enquire.html fi/enquire.html sv/enquire.html no/enquire.html da/enquire.html de/enquire.html fr/enquire.html es/enquire.html nl/enquire.html et/enquire.html it/enquire.html zh-cn/enquire.html; do
            grep -q "mailto:info@lakesidevillaandspa.com" "$f" || { echo "$f: email missing" >&2; exit 1; }
          done

      - name: Commit and push Enquire cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add enquire.html fi/enquire.html sv/enquire.html no/enquire.html da/enquire.html de/enquire.html fr/enquire.html es/enquire.html nl/enquire.html et/enquire.html it/enquire.html zh-cn/enquire.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove broker-specific stay essentials from Enquire pages"
          git push origin HEAD:chatgpt/tahko-kuopio-route-production
