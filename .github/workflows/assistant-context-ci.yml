name: Villa Assistant context CI

on:
  pull_request:
    paths:
      - "assets/villa-assistant.js"
      - "assets/site-consent.js"
      - "assets/privacy.js"
      - "privacy.html"
      - ".github/workflows/assistant-context-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check assets/villa-assistant.js
      - run: node --check assets/site-consent.js
      - run: node --check assets/privacy.js
      - run: grep -q 'assets/privacy.js' privacy.html
      - run: grep -q 'assets/site-consent.js' privacy.html
