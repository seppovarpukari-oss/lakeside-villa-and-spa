name: Temporary Enquire cleanup

on:
  push:
    branches:
      - chatgpt/tahko-kuopio-route-production

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[skip-enquire-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/tahko-kuopio-route-production
          fetch-depth: 0

      - name: Remove Enquire stay-essentials block and its exclusive CSS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('enquire.html'),
              Path('fi/enquire.html'),
              Path('sv/enquire.html'),
              Path('no/enquire.html'),
              Path('da/enquire.html'),
              Path('de/enquire.html'),
              Path('fr/enquire.html'),
              Path('es/enquire.html'),
              Path('nl/enquire.html'),
              Path('et/enquire.html'),
              Path('it/enquire.html'),
              Path('zh-cn/enquire.html'),
          ]

          section_re = re.compile(
              r'\n?<section(?=[^>]*\bclass="p0098-facts")(?=[^>]*\bid="stay-essentials")[^>]*>.*?</section>\n?',
              re.S,
          )
          css_re = re.compile(
              r'\n?/\* P-0098 visible fact layer\.[\s\S]*?(?=\n/\* 12-language crawlable URL architecture foundation \*/)',
          )

          for path in paths:
              text = path.read_text(encoding='utf-8')
              original = text
              email_count = text.count('mailto:info@lakesidevillaandspa.com')

              if text.count('id="stay-essentials"') != 1:
                  raise SystemExit(f'{path}: expected exactly one stay-essentials section')

              section_matches = list(section_re.finditer(text))
              css_matches = list(css_re.finditer(text))
              if len(section_matches) != 1:
                  raise SystemExit(f'{path}: expected exactly one fact section match, got {len(section_matches)}')
              if len(css_matches) != 1:
                  raise SystemExit(f'{path}: expected exactly one P-0098 CSS block, got {len(css_matches)}')

              # Verify p0098 classes are not used anywhere else on this Enquire page.
              masked = section_re.sub('', text, count=1)
              masked = css_re.sub('', masked, count=1)
              if 'p0098-' in masked:
                  raise SystemExit(f'{path}: p0098 class is used outside the removable section/CSS; refusing to edit')

              text = section_re.sub('\n', text, count=1)
              text = css_re.sub('\n', text, count=1)

              if 'stay-essentials' in text or 'p0098-' in text:
                  raise SystemExit(f'{path}: cleanup incomplete')
              if text.count('mailto:info@lakesidevillaandspa.com') != email_count:
                  raise SystemExit(f'{path}: contact email occurrence count changed')
              if email_count < 1:
                  raise SystemExit(f'{path}: expected contact email was not present before edit')
              if text == original:
                  raise SystemExit(f'{path}: no change made')

              path.write_text(text, encoding='utf-8')
              print(f'cleaned {path}')
          PY

          git diff --check

      - name: Commit cleanup to work branch
        shell: bash
        run: |
          git config user.name "ChatGPT cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add enquire.html fi/enquire.html sv/enquire.html no/enquire.html da/enquire.html de/enquire.html fr/enquire.html es/enquire.html nl/enquire.html et/enquire.html it/enquire.html zh-cn/enquire.html
          git diff --cached --quiet && { echo "No cleanup changes found"; exit 1; }
          git commit -m "[skip-enquire-cleanup] Remove Enquire stay essentials facts"
          git push origin HEAD:chatgpt/tahko-kuopio-route-production
