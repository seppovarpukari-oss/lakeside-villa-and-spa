<style>
:root{--bg:#11120f;--ink:#f2eee5;--muted:#c9c4b9;--gold:#a98b57;--line:rgba(255,255,255,.07);--serif:"EB Garamond",Georgia,serif;--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.site-header{justify-content:flex-start}
.error-main{min-height:calc(100vh - var(--chrome-height));display:grid;place-items:center;padding:clamp(72px,9vw,140px) max(var(--chrome-pad),env(safe-area-inset-right)) clamp(72px,9vw,140px) max(var(--chrome-pad),env(safe-area-inset-left));text-align:center}
.error-card{max-width:780px}
.error-code{margin:0 0 20px;color:var(--gold);font:500 11px/1.2 var(--sans);letter-spacing:.18em;text-transform:uppercase}
h1{margin:0;font:400 clamp(48px,5.2vw,82px)/1 var(--serif);letter-spacing:.018em;text-wrap:balance}
p{max-width:610px;margin:26px auto 0;color:var(--muted);font:400 clamp(15px,1.05vw,17px)/1.7 var(--sans)}
.error-links{display:flex;justify-content:center;gap:30px;flex-wrap:wrap;margin-top:44px}
.error-links a{font:500 10px/1.2 var(--sans);letter-spacing:.16em;text-transform:uppercase;border-bottom:1px solid rgba(169,139,87,.62);padding-bottom:6px}
.error-place{margin-top:72px;color:#858178;font:500 9px/1.2 var(--sans);letter-spacing:.17em;text-transform:uppercase}
@media(max-width:560px){.error-main{padding-left:22px;padding-right:22px}.error-links{gap:22px;margin-top:36px}.error-place{margin-top:56px}}

<div class="error-links"><a href="/">Return home</a><a href="/enquire.html">Enquire</a></div>

</div>
