<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<title>Privacy & Cookies | Lakeside Villa & Spa</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#11110f;--panel:#171714;--ink:#eee9de;--muted:#b9b3a8;--gold:#cdbf9d;--line:rgba(205,191,157,.18);--serif:"EB Garamond",Georgia,serif;--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
a{color:inherit}.privacy-header{height:68px;display:flex;align-items:center;padding:0 clamp(22px,5vw,72px);border-bottom:1px solid var(--line);background:#171714}
.privacy-header img{display:block;width:108px;height:30px}.privacy-main{max-width:940px;margin:0 auto;padding:clamp(64px,8vw,110px) clamp(22px,5vw,72px) 96px}
.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}.privacy-main h1{font:400 clamp(44px,6vw,72px)/1 var(--serif);letter-spacing:.02em;margin:0 0 24px}
#privacy-intro{font-size:17px;line-height:1.75;color:#d5cec1;max-width:760px;margin:0 0 64px}
#privacy-sections{border-top:1px solid var(--line)}#privacy-sections section{padding:30px 0;border-bottom:1px solid var(--line)}
#privacy-sections h2{font:400 clamp(27px,3vw,36px)/1.1 var(--serif);margin:0 0 12px;color:#f0eadf}
#privacy-sections p{font-size:14px;line-height:1.8;color:var(--muted);margin:0;max-width:820px}
.privacy-back{display:inline-block;margin-top:42px;color:var(--gold);font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none}
.privacy-footer{border-top:1px solid var(--line);padding:28px clamp(22px,5vw,72px);display:flex;gap:24px;justify-content:space-between;flex-wrap:wrap;color:#918c82;font-size:11px}
.privacy-footer a,.privacy-footer button{color:inherit;background:none;border:0;padding:0;font:inherit;text-decoration:none;cursor:pointer}
.tlvs-consent{position:fixed;z-index:9999;left:20px;right:20px;bottom:20px;max-width:760px;margin:auto;background:#1a1916;color:#eee9de;border:1px solid rgba(205,191,157,.28);padding:22px;box-shadow:0 16px 50px rgba(0,0,0,.35)}
.tlvs-consent[hidden]{display:none}.tlvs-consent h2{font:400 28px/1.1 var(--serif);margin:0 0 10px}.tlvs-consent p{font-size:13px;line-height:1.55;color:#c8c1b5;margin:0 0 16px}.tlvs-consent-actions{display:flex;gap:10px;flex-wrap:wrap}.tlvs-consent button{min-height:42px;padding:9px 14px;border:1px solid rgba(205,191,157,.35);background:#23211d;color:#eee9de}
@media(max-width:560px){.privacy-header{height:58px}.privacy-main{padding-top:54px}.privacy-footer{flex-direction:column}.tlvs-consent{left:12px;right:12px;bottom:12px}}
</style>
<script defer src="assets/site-consent.js"></script>
<script defer src="assets/privacy.js"></script>
</head>
<body>
<header class="privacy-header"><a href="/" aria-label="Lakeside Villa & Spa home"><img src="assets/lakeside-wordmark.svg" alt="Lakeside Villa & Spa" width="108" height="30"></a></header>
<main class="privacy-main">
<div class="eyebrow">Lakeside Villa & Spa</div>
<h1 id="privacy-title">Privacy & Cookies</h1>
<p id="privacy-intro"></p>
<div id="privacy-sections"></div>
<a id="privacy-back" class="privacy-back" href="/">Back to Lakeside Villa & Spa</a>
</main>
<footer class="privacy-footer">
<span>© Lakeside Villa & Spa</span>
<span><a href="#cookies" data-i18n="cookies">Cookie preferences</a></span>
</footer>
</body>
</html>
